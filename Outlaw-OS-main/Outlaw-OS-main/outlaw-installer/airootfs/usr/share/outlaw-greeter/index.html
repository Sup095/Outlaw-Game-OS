<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none';">
    <title>Outlaw OS</title>
    <style>
        :root {
            --bg:       #0b0e14;
            --bg-alt:   #11151f;
            --panel:    #161b27;
            --panel-hi: #1d2433;
            --border:   #2a3242;
            --text:     #e8eaed;
            --muted:    #838c9c;
            --accent:   #e0b341;
            --accent2:  #f4d27a;
            --accent-dim: #7d6526;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: "JetBrains Mono", "Cascadia Mono", "Consolas", monospace;
            font-size: 12pt;
            height: 100vh;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            padding: 22px 28px 18px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background:
                radial-gradient(circle at 50% -10%, rgba(224, 179, 65, 0.10), transparent 60%),
                linear-gradient(180deg, #11151f 0%, #0b0e14 100%);
        }
        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 18px;
        }
        .brand {
            font-size: 16pt;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--accent2);
        }
        .brand .star { color: var(--accent); margin-right: 8px; }
        .tag { color: var(--muted); font-size: 10pt; }
        h1 {
            font-size: 14pt;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text);
        }
        .lede {
            color: var(--muted);
            font-size: 10.5pt;
            margin-bottom: 16px;
        }
        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            flex: 1;
        }
        button.card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            text-align: left;
            padding: 18px 18px 16px;
            cursor: pointer;
            transition: transform 80ms ease, border-color 100ms ease, background 100ms ease;
            font-family: inherit;
            font-size: inherit;
            display: flex;
            flex-direction: column;
            gap: 8px;
            outline: none;
        }
        button.card:hover,
        button.card:focus-visible {
            background: var(--panel-hi);
            border-color: var(--accent);
        }
        button.card:active { transform: translateY(1px); }
        .card .row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card .ico {
            font-size: 22pt;
            line-height: 1;
        }
        .card .title {
            font-size: 13pt;
            font-weight: 700;
            color: var(--accent2);
            letter-spacing: 0.5px;
        }
        .card .desc {
            color: var(--muted);
            font-size: 10pt;
            line-height: 1.5;
        }
        .card .pill {
            display: inline-block;
            font-size: 8pt;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #1a1407;
            background: var(--accent2);
            border-radius: 4px;
            padding: 2px 6px;
            margin-top: 4px;
            width: fit-content;
        }
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            color: var(--muted);
            font-size: 9pt;
        }
        a.muted-link {
            color: var(--muted);
            cursor: pointer;
            text-decoration: none;
            border-bottom: 1px dotted var(--muted);
        }
        a.muted-link:hover { color: var(--accent2); border-bottom-color: var(--accent2); }
        .hint { letter-spacing: 0.5px; }
        label.remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 9pt;
            cursor: pointer;
        }
        label.remember:hover { color: var(--text); }
        label.remember input[type="checkbox"] {
            accent-color: var(--accent);
            width: 13px;
            height: 13px;
            cursor: pointer;
        }
        /* Phase 8 — cinematic boot intro (always green + CRT, a fixed identity
           moment) shown before the chooser. Skippable; auto-reveals the chooser. */
        #boot-intro {
            position: fixed; inset: 0; z-index: 50; background: #050705; color: #33ff00;
            display: flex; flex-direction: column; padding: 18px 22px; overflow: hidden;
        }
        #boot-intro.hide { display: none; }
        #boot-intro::after {
            content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3;
            background: repeating-linear-gradient(0deg,
                rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,30,0,0.30) 3px, rgba(0,0,0,0) 4px);
        }
        #bi-sigil {
            position: absolute; top: 24%; left: 0; right: 0; text-align: center; font-size: 92px;
            line-height: 1; color: #33ff00; opacity: 0; z-index: 2;
            text-shadow: 0 0 16px rgba(51,255,0,0.6), 0 0 38px rgba(51,255,0,0.3);
        }
        #bi-sigil.warm { animation: bi-warm 2.6s ease-out forwards; }
        @keyframes bi-warm {
            0%{opacity:0} 9%{opacity:.5} 13%{opacity:.08} 19%{opacity:.8} 24%{opacity:.16}
            32%{opacity:1} 38%{opacity:.5} 48%{opacity:1} 100%{opacity:.9}
        }
        #bi-log { white-space: pre-wrap; line-height: 1.55; font-size: 10.5pt; flex: 1;
            position: relative; z-index: 1; overflow: hidden; }
        #bi-skip { position: absolute; bottom: 12px; right: 20px; color: #2c7a2c; font-size: 9pt; z-index: 4; }
        .preflight {
            margin-top: 10px; background: var(--panel); border: 1px solid var(--border);
            border-radius: 8px; padding: 9px 12px; font-size: 9.5pt; color: var(--muted);
            line-height: 1.6; display: none;
        }
        .preflight.show { display: block; }
        .preflight b { color: var(--accent2); }
        .preflight .warn { color: var(--accent); }
    </style>
</head>
<body>
    <div id="boot-intro">
        <div id="bi-sigil" aria-hidden="true">⌬</div>
        <div id="bi-log"></div>
        <div id="bi-skip">press any key to skip</div>
    </div>

    <header>
        <div class="brand"><span class="star">⟁</span>OUTLAW_OS</div>
        <div class="tag">// SESSION SELECT</div>
    </header>

    <h1>What are you here to do?</h1>
    <div class="lede">Pick once per boot. You can flip later from Settings &rarr; Session.</div>

    <div class="choices">
        <button class="card" data-choice="dev" autofocus>
            <div class="row">
                <span class="ico">🛠</span>
                <span class="title">Dev session</span>
            </div>
            <div class="desc">
                Open <strong>Outlaw CodeMaker</strong> — the AI agent that builds
                Godot games with you. LM Studio runs the model.
            </div>
            <span class="pill">Make a game</span>
        </button>

        <button class="card" data-choice="desktop">
            <div class="row">
                <span class="ico">⌂</span>
                <span class="title">Desktop</span>
            </div>
            <div class="desc">
                Open the standard shell — browser, files, terminal, Steam,
                Apps panel, on-device AI assistant.
            </div>
            <span class="pill">Use the OS</span>
        </button>
    </div>

    <div class="preflight" id="preflight-out"></div>

    <footer>
        <label class="remember">
            <input type="checkbox" id="remember-choice">
            <span>Always start in this session (skip this screen on future boots)</span>
        </label>
        <span class="hint">↹ TAB · ENTER to choose</span>
        <a class="muted-link" data-action="preflight">🔍 check this PC</a>
        <a class="muted-link" data-choice="tty">drop to a terminal</a>
    </footer>

    <script src="renderer.js"></script>
</body>
</html>
