# ============================================================================
# Outlaw OS — force the framebuffer (fbdev) Xorg driver.
# ----------------------------------------------------------------------------
# The live ISO always boots with `nomodeset` so it's visible on VirtualBox
# (VMSVGA+EFI otherwise black-screens once a KMS driver loads). With KMS off,
# Xorg's modesetting/vboxvideo drivers can't run, and the `vesa` driver needs
# a real-mode VESA BIOS that doesn't exist under UEFI. The ONLY driver that
# works in that mode is fbdev, which renders to the kernel's EFI framebuffer
# (/dev/fb0). Xorg's auto-detection doesn't always fall through to it, so we
# pin it explicitly — without this, X finds no usable screen and the desktop
# never starts (you're left at a blank console).
#
# This file ships on the LIVE ISO only. The installer copies it to an
# installed system ONLY when it detects a VM (real hardware keeps KMS + its
# proper accelerated driver, so it must NOT be forced to fbdev).
# ============================================================================
Section "Device"
    Identifier  "Outlaw Framebuffer"
    Driver      "fbdev"
EndSection
