# ============================================================================
# Outlaw Game OS — automated ISO build
# ----------------------------------------------------------------------------
# Fires on:
#   * Tag push  matching v* or V*  (publishes ISO to the matching Release)
#   * workflow_dispatch             (manual builds — produces an artifact only)
#
# Builds inside the official archlinux container so mkarchiso has the exact
# environment it expects. The job takes ~15–25 minutes; mostly pacstrap +
# squashfs compression.
#
# On a tag push, the resulting outlaw-os-v<version>.iso and the matching
# .sha256 file are attached to the GitHub Release. Users go to your Releases
# page, click the .iso link, and they have everything they need.
#
# Repo layout note: the installer tree lives under Outlaw-OS-main/Outlaw-OS-main/
# (artefact of how the original .zip extracted). Paths throughout this file
# honour that. CodeMaker lives at the repo root as a normal directory.
# ============================================================================

name: build-iso

on:
  push:
    # Accept lowercase v* and capital V* so either tagging convention works.
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: write   # uploading release assets requires this

env:
  # Opt every JavaScript action into Node 24. Several v4/v2 actions still ship
  # with a Node 20 runtime, which GitHub is forcing to Node 24 on 2026-06-16
  # anyway — set this now so we're explicit, not relying on the auto-flip.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

  # The repo nests the installer tree under Outlaw-OS-main/Outlaw-OS-main/.
  # Defining this once keeps the paths below readable.
  INSTALLER_DIR: Outlaw-OS-main/Outlaw-OS-main/outlaw-installer
  # build.sh writes the ISO to $REPO_ROOT/out, where REPO_ROOT is the parent
  # of outlaw-installer/. So the ISO lands at Outlaw-OS-main/Outlaw-OS-main/out/.
  OUTPUT_DIR: Outlaw-OS-main/Outlaw-OS-main/out

jobs:
  # --------------------------------------------------------------------------
  # Phase 4: package preflight. Validate that EVERY package we ask pacman to
  # install (the live-ISO packages.x86_64 + the installer's ESSENTIAL_PKGS)
  # actually resolves in the official Arch repos — BEFORE the ~20-minute ISO
  # build. A typo, a renamed package, an AUR-only name, or one dropped from
  # the repos (we've hit all of these: ollama, steamcmd, xf86-video-vmware)
  # now fails here in seconds with a clear list, instead of deep inside
  # pacstrap 20 minutes in. The build job `needs:` this, so it won't even
  # start until the names check out.
  # --------------------------------------------------------------------------
  preflight:
    name: Validate package names
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:latest
    steps:
      - name: Refresh pacman + enable multilib
        run: |
          set -e
          pacman-key --init
          pacman-key --populate archlinux
          # Our package set includes lib32-* packages, so the multilib repo
          # must be enabled for them to resolve.
          if ! grep -q '^\[multilib\]' /etc/pacman.conf; then
            printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          fi
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git

      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate every package resolves in the Arch repos
        run: |
          set -uo pipefail
          PKGFILE="$INSTALLER_DIR/packages.x86_64"
          INSTALLER="$INSTALLER_DIR/airootfs/usr/local/bin/outlaw-install"

          echo "::group::Collecting package names"
          # Live-ISO set: one package per line. Drop comment + blank lines,
          # then take the first whitespace-delimited field of each line (the
          # package name) — this trims indentation WITHOUT collapsing newlines.
          mapfile -t LIVE < <(grep -vE '^[[:space:]]*#|^[[:space:]]*$' "$PKGFILE" \
                              | awk '{print $1}' | grep -v '^$' || true)
          # Installed-system ESSENTIAL_PKGS bash array: take lines between
          # 'ESSENTIAL_PKGS=(' and the closing ')', strip inline comments,
          # split into words, keep package-looking tokens.
          mapfile -t ESS < <(awk '/ESSENTIAL_PKGS=\(/{f=1;next} f&&/^\)/{f=0} f{sub(/#.*/,"");print}' "$INSTALLER" \
                              | tr ' \t' '\n\n' | grep -E '^[a-z0-9]' || true)
          ALL="$(printf '%s\n' "${LIVE[@]}" "${ESS[@]}" | sort -u | grep -v '^$' || true)"
          COUNT="$(printf '%s\n' "$ALL" | grep -c . || true)"
          echo "Live-ISO packages   : ${#LIVE[@]}"
          echo "Installer essential : ${#ESS[@]}"
          echo "Unique to validate  : $COUNT"
          printf '%s\n' "$ALL" | tr '\n' ' '; echo
          echo "::endgroup::"

          echo "::group::Resolving against the repos"
          MISSING=""
          while IFS= read -r pkg; do
            [[ -z "$pkg" ]] && continue
            if pacman -Si -- "$pkg" >/dev/null 2>&1; then
              echo "  ok   $pkg"
            else
              echo "  MISS $pkg"
              MISSING="$MISSING $pkg"
            fi
          done <<< "$ALL"
          echo "::endgroup::"

          if [[ -n "${MISSING// /}" ]]; then
            echo "::error::Package preflight FAILED — these don't resolve in the official Arch repos (typo / renamed / AUR-only / dropped):$MISSING"
            echo ""
            echo "Fix the name(s) in $PKGFILE and/or ESSENTIAL_PKGS in outlaw-install,"
            echo "or move any AUR-only package to an on-demand install. This check runs"
            echo "BEFORE the ~20-minute ISO build so you catch it in seconds."
            exit 1
          fi
          echo "✅ All $COUNT packages resolve in the official repos. Safe to build."

  build:
    name: Build Outlaw OS ISO
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:latest
      # mkarchiso uses loop devices + chroot. The GitHub Actions runner
      # supports privileged containers; we need it for archiso to function.
      options: --privileged

    steps:
      - name: Refresh pacman + install build deps
        run: |
          # Keyring init + sync. Container images sometimes ship a stale or
          # missing keyring which makes pacman -Sy fail. This makes it robust.
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            archiso git base-devel \
            nodejs python python-pip rsync \
            mkinitcpio mkinitcpio-archiso squashfs-tools \
            dosfstools mtools libisoburn

      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # Need submodules if the repo grows them later; harmless if none.
          submodules: recursive
          fetch-depth: 1

      - name: Diagnostics — environment + workspace tree
        # If a later step fails silently, this gives us *something* to diff
        # against when reading the run log. Cheap, fast, easy.
        run: |
          set -e
          echo "::group::Runner environment"
          uname -a
          echo "Node: $(node --version 2>/dev/null || echo none)"
          echo "Bash: $BASH_VERSION"
          echo "PWD : $(pwd)"
          echo "Free disk:"
          df -h / "$GITHUB_WORKSPACE" 2>/dev/null || df -h
          echo "Free memory:"
          free -h 2>/dev/null || echo "(free not available)"
          echo "::endgroup::"

          echo "::group::Workspace top level"
          ls -la "$GITHUB_WORKSPACE"
          echo "::endgroup::"

          echo "::group::INSTALLER_DIR contents"
          if [[ -d "$INSTALLER_DIR" ]]; then
            ls -la "$INSTALLER_DIR"
          else
            echo "::error::INSTALLER_DIR ($INSTALLER_DIR) does not exist."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::CodeMaker source sanity"
          CM="$GITHUB_WORKSPACE/Outlaw CodeMaker"
          if [[ -d "$CM" ]]; then
            echo "Found CodeMaker dir."
            [[ -f "$CM/main.py" ]] && echo "  main.py present." || echo "::warning::main.py missing — bundler will skip."
            ls "$CM" | head -20
          else
            echo "::warning::Outlaw CodeMaker dir missing — Dev session will fall back to desktop."
          fi
          echo "::endgroup::"

      - name: Make the build script executable
        run: |
          set -e
          # Defensive: GitHub-hosted repos sometimes lose +x on checkout.
          chmod +x "$INSTALLER_DIR/build.sh"
          chmod +x "$INSTALLER_DIR/bundle-codemaker.sh"
          # Mark every helper in the airootfs/usr/local/bin executable too —
          # mkarchiso copies bits straight from the working tree, so the +x
          # flag on the host filesystem matters.
          find "$INSTALLER_DIR/airootfs/usr/local/bin" -type f -exec chmod +x {} +
          echo "Permissions set. build.sh: $(ls -l "$INSTALLER_DIR/build.sh")"

      - name: Derive ISO version from tag (if this is a tag build)
        id: ver
        run: |
          # Strip leading v/V from the tag so v2.0.1-beta -> 2.0.1-beta.
          # On non-tag builds (workflow_dispatch / branch pushes) we just leave
          # ISO_VERSION at the default baked into build.sh.
          REF="${GITHUB_REF_NAME:-}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${REF#v}"
            VERSION="${VERSION#V}"
            echo "iso_version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Using ISO_VERSION=$VERSION (derived from tag $REF)"
          else
            echo "iso_version=" >> "$GITHUB_OUTPUT"
            echo "No tag — build.sh will use its built-in default."
          fi

      - name: Build the ISO
        env:
          # build.sh looks for CodeMaker via OUTLAW_CODEMAKER_SRC first. Point
          # it at the top-level CodeMaker directory in the repo.
          OUTLAW_CODEMAKER_SRC: ${{ github.workspace }}/Outlaw CodeMaker
          # When this is a tag build, override the version. Otherwise empty,
          # which build.sh treats as "keep your default".
          OUTLAW_ISO_VERSION: ${{ steps.ver.outputs.iso_version }}
        run: |
          set -e
          cd "$INSTALLER_DIR"

          # Capture build output to a log file we can always tail later, even
          # when GitHub's collapsed-step viewer hides the actual failure line.
          LOG="$GITHUB_WORKSPACE/build.log"
          if ./build.sh 2>&1 | tee "$LOG"; then
            echo "::notice::build.sh succeeded."
          else
            RC=${PIPESTATUS[0]}
            echo "::error::build.sh failed with exit code $RC"
            echo "::group::Last 200 lines of build output (recap)"
            tail -n 200 "$LOG" || true
            echo "::endgroup::"
            echo "::group::Disk usage at failure time"
            df -h
            echo "::endgroup::"
            exit "$RC"
          fi

      - name: Upload build log (always — useful for diagnosing failures too)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Locate built artifacts
        id: artifacts
        run: |
          # Resolve to absolute paths so downstream steps don't depend on cwd.
          ISO_ABS=$(ls -1 "$GITHUB_WORKSPACE/$OUTPUT_DIR"/outlaw-os-v*.iso 2>/dev/null | head -n1 || true)
          if [[ -z "$ISO_ABS" || ! -f "$ISO_ABS" ]]; then
            echo "::error::ISO not produced under $OUTPUT_DIR — check the build log above." >&2
            ls -lh "$GITHUB_WORKSPACE/$OUTPUT_DIR" 2>&1 || true
            exit 1
          fi
          SHA_ABS="$ISO_ABS.sha256"
          ISO_NAME=$(basename "$ISO_ABS")
          # upload-artifact + softprops/action-gh-release want workspace-
          # relative paths. Strip the workspace prefix.
          ISO_REL="${ISO_ABS#$GITHUB_WORKSPACE/}"
          SHA_REL="${SHA_ABS#$GITHUB_WORKSPACE/}"
          echo "iso_abs=$ISO_ABS"   >> "$GITHUB_OUTPUT"
          echo "sha_abs=$SHA_ABS"   >> "$GITHUB_OUTPUT"
          echo "iso_rel=$ISO_REL"   >> "$GITHUB_OUTPUT"
          echo "sha_rel=$SHA_REL"   >> "$GITHUB_OUTPUT"
          echo "iso_name=$ISO_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO_ABS" "$SHA_ABS"

      # Package the shell as a self-update component tarball. The in-OS
      # self-updater (outlaw-shell/updater.js) looks for an asset named
      # outlaw-shell-v<ver>.tar.gz on the GitHub release, verifies its
      # .sha256, and hands it to outlaw-update-apply for an atomic in-place
      # swap. Without this asset the "Update Outlaw OS" button has nothing
      # to download. node_modules is excluded to match what ships on the ISO
      # (the shell runs on the system `electron` package + Node built-ins).
      - name: Package shell self-update component
        id: components
        run: |
          set -e
          SHELL_DIR="$GITHUB_WORKSPACE/Outlaw-OS-main/Outlaw-OS-main/outlaw-shell"
          if [[ ! -f "$SHELL_DIR/package.json" ]]; then
            echo "::warning::shell dir not found at $SHELL_DIR — skipping component tarball."
            exit 0
          fi
          # Version: prefer the tag-derived value, else read the shell's package.json.
          VER="${{ steps.ver.outputs.iso_version }}"
          if [[ -z "$VER" ]]; then
            VER="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$SHELL_DIR/package.json" | head -n1)"
          fi
          OUT="$GITHUB_WORKSPACE/outlaw-shell-v${VER}.tar.gz"
          BASE="$GITHUB_WORKSPACE/Outlaw-OS-main/Outlaw-OS-main"
          # COMPREHENSIVE payload: shell files flat at the root (so an older
          # outlaw-update-apply still finds package.json and swaps the shell),
          # plus every other Outlaw component under components/ so a modern
          # update refreshes the helpers, greeter, first-boot wizard, GUI
          # installer, polkit rule and CodeMaker's code — not just the shell.
          STAGE="$GITHUB_WORKSPACE/_payload"
          rm -rf "$STAGE"; mkdir -p "$STAGE/components/bin" "$STAGE/components/polkit"
          rsync -a --exclude=node_modules --exclude=package-lock.json "$SHELL_DIR/" "$STAGE/"
          cp "$BASE"/outlaw-installer/airootfs/usr/local/bin/outlaw-* "$STAGE/components/bin/" 2>/dev/null || true
          [ -d "$BASE/outlaw-installer/airootfs/usr/share/outlaw-greeter" ] && \
            rsync -a --exclude=node_modules "$BASE/outlaw-installer/airootfs/usr/share/outlaw-greeter/" "$STAGE/components/greeter/"
          [ -d "$BASE/outlaw-firstboot" ] && \
            rsync -a --exclude=node_modules "$BASE/outlaw-firstboot/" "$STAGE/components/firstboot/"
          [ -d "$BASE/outlaw-installer-gui" ] && \
            rsync -a --exclude=node_modules "$BASE/outlaw-installer-gui/" "$STAGE/components/installer-gui/"
          cp "$BASE/outlaw-installer/airootfs/etc/polkit-1/rules.d/49-outlaw.rules" "$STAGE/components/polkit/" 2>/dev/null || true
          CM="$GITHUB_WORKSPACE/Outlaw CodeMaker"
          if [ -d "$CM" ]; then
            rsync -a --exclude=.venv --exclude=db --exclude=backups --exclude=workspace \
              --exclude=__pycache__ --exclude='.git' --exclude='*.pyc' "$CM/" "$STAGE/components/codemaker/"
          fi
          tar -czf "$OUT" -C "$STAGE" .
          sha256sum "$OUT" | awk '{print $1}' > "$OUT.sha256"
          echo "shell_tar_rel=${OUT#$GITHUB_WORKSPACE/}"        >> "$GITHUB_OUTPUT"
          echo "shell_sha_rel=${OUT#$GITHUB_WORKSPACE/}.sha256" >> "$GITHUB_OUTPUT"
          echo "shell_tar_name=$(basename "$OUT")"              >> "$GITHUB_OUTPUT"
          ls -lh "$OUT" "$OUT.sha256"

      # Manual builds and main-branch builds keep the ISO as a workflow
      # artifact (downloadable from the Actions tab). Tag-driven builds also
      # attach it to the matching GitHub Release in the next step.
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.artifacts.outputs.iso_name }}
          path: |
            ${{ steps.artifacts.outputs.iso_rel }}
            ${{ steps.artifacts.outputs.sha_rel }}
            ${{ steps.components.outputs.shell_tar_rel }}
            ${{ steps.components.outputs.shell_sha_rel }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Auto-creates the Release if it doesn't exist; updates if it does.
          # The shell component tarball + its .sha256 power the in-OS
          # "Update Outlaw OS" self-updater (no full reinstall needed).
          files: |
            ${{ steps.artifacts.outputs.iso_rel }}
            ${{ steps.artifacts.outputs.sha_rel }}
            ${{ steps.components.outputs.shell_tar_rel }}
            ${{ steps.components.outputs.shell_sha_rel }}
          generate_release_notes: true
          # Mark every -Beta tag as a PRE-RELEASE so GitHub's "latest" (which the
          # updater's stable channel uses) never auto-serves a beta. Only a clean
          # non-Beta tag (e.g. V2.1.0) becomes a stable "latest" release. Beta
          # testers opt in via Settings → Update channel → Beta.
          prerelease: ${{ contains(github.ref_name, 'Beta') || contains(github.ref_name, 'beta') }}
          body: |
            ## Outlaw Game OS ${{ github.ref_name }}

            **Burn this ISO to a USB drive, boot it, and you're in.**

            ### Install on your computer
            1. Download `${{ steps.artifacts.outputs.iso_name }}` from this Release.
            2. Burn it to a USB stick (8 GB or larger):
               - **Windows:** Use [Rufus](https://rufus.ie/) — pick the ISO, pick your USB, leave defaults, Start.
               - **macOS / Linux:** `dd if=${{ steps.artifacts.outputs.iso_name }} of=/dev/sdX bs=4M status=progress` (replace `/dev/sdX` with your USB device).
            3. Boot from the USB (F12 / F2 / Del at startup — varies by motherboard).
            4. You'll land in the live desktop. Try it live, or click **Install Outlaw OS** to install to disk.

            ### Two install paths
            - **Install alongside other OSes** (recommended) — Outlaw goes into a single empty partition you pick. Windows / your data / other Linux installs stay 100% intact. Need to make space? Open **GParted** from the menu and shrink your Windows partition first.
            - **Erase a whole disk** (destructive) — wipe a drive, make Outlaw the only OS on it. Requires typing the device name *and* the word `ERASE` to confirm.

            Either way, GRUB sees your other operating systems and adds them to the boot menu automatically.

            ### Verify the download (recommended)
            ```bash
            sha256sum -c ${{ steps.artifacts.outputs.iso_name }}.sha256
            ```
