# ============================================================================
# Outlaw Game OS — static / security / consistency checks
# ----------------------------------------------------------------------------
# Fast gate that runs on every push + PR. Validates that every script, JS
# module, and Python file parses; runs shellcheck; scans for unsafe patterns
# (Electron hardening, secrets, shell=True); and verifies cross-file
# consistency (versions agree, no stray tooling refs, helper files exist).
#
# This is the "stress test everything" suite. It does NOT build the ISO
# (that's build-iso.yml on tag push) — it's the quick correctness gate that
# catches breakage in seconds.
# ============================================================================

name: checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static + security + consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # node + python3 are preinstalled on ubuntu-latest runners.
          node --version
          python3 --version
          shellcheck --version

      - name: Run the full check suite
        run: |
          chmod +x tests/check-all.sh
          bash tests/check-all.sh

  codemaker-tests:
    name: CodeMaker pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CodeMaker test dependencies
        working-directory: Outlaw CodeMaker
        run: |
          python -m pip install --upgrade pip
          # Linux deps (no pywin32). Fall back to requirements.txt if the
          # Linux-specific file is absent. Never fail the job on a missing
          # optional dep — pytest collection will report what's truly broken.
          if [ -f requirements-linux.txt ]; then
            pip install -r requirements-linux.txt || true
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          fi
          pip install pytest || true

      - name: Run pytest (non-blocking on collection-only envs)
        working-directory: Outlaw CodeMaker
        run: |
          # Some tests need a display / Qt; run headless and don't let an
          # environment-specific skip fail the gate. Real test failures DO
          # fail the job.
          if [ -d tests ]; then
            xvfb-run -a python -m pytest tests/ -q || python -m pytest tests/ -q
          else
            echo "No tests/ dir — skipping."
          fi
